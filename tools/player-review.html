<!doctype html><meta charset="UTF-8"><title>Protagonist Model Review</title><style>body{margin:0;background:#e7e7e2;color:#4d4b54;font:14px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh}nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px}button{border:1px solid #c9c9c2;border-radius:20px;background:#fffffff0;color:#524a62;padding:9px 18px;cursor:pointer}#state{display:none}</style><canvas aria-label="Protagonist 3D preview"></canvas><nav><button data-angle="0">Front</button><button data-angle="-.65">Three-quarter</button><button data-angle="-1.5708">Side</button><button data-angle="3.14159">Back</button><button id="walk">Walk</button><button id="idle">Idle</button></nav><output id="state"></output><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.NeutralToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFShadowMap;
const scene=new T.Scene();scene.background=new T.Color('#e7e7e2');scene.add(new T.HemisphereLight('#fff7ef','#c7c4d3',2.2));const sun=new T.DirectionalLight('#fff8f1',2.1);sun.position.set(-3,5,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.normalBias=.015;scene.add(sun);const f=new T.Mesh(new T.PlaneGeometry(50,50),new T.MeshStandardMaterial({color:'#e4e4dd',roughness:1}));f.rotation.x=-Math.PI/2;f.receiveShadow=true;scene.add(f);
const h=1.43,camera=new T.OrthographicCamera(-h*innerWidth/innerHeight,h*innerWidth/innerHeight,h,-h,.1,100);camera.position.set(0,1.4,7);camera.lookAt(0,1.12,0);
const g=await new GLTFLoader().loadAsync('/models/player.glb');const root=g.scene;scene.add(root);root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});const mixer=new T.AnimationMixer(root),walk=mixer.clipAction(g.animations.find(a=>a.name==='Player_Walk')),idle=mixer.clipAction(g.animations.find(a=>a.name==='Player_Idle'));idle.play();let mode='idle';
for(const b of document.querySelectorAll('[data-angle]'))b.onclick=()=>root.rotation.y=Number(b.dataset.angle);document.getElementById('walk').onclick=()=>{idle.stop();walk.reset().play();mode='walk'};document.getElementById('idle').onclick=()=>{walk.stop();idle.reset().play();mode='idle'};
let last=performance.now();function frame(t){requestAnimationFrame(frame);if(t-last<32)return;const dt=(t-last)/1000;last=t;mixer.update(Math.min(dt,.067));renderer.render(scene,camera);document.getElementById('state').textContent=JSON.stringify({mode,angle:root.rotation.y,animationTime:mixer.time,triangles:renderer.info.render.triangles});}requestAnimationFrame(frame);
</script>
