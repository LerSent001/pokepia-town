<!doctype html><meta charset="UTF-8"><style>body{margin:0;overflow:hidden}canvas{display:block}</style><canvas></canvas><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
const r=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(1);r.toneMapping=T.NeutralToneMapping;r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;
const s=new T.Scene();s.background=new T.Color('#dfead7');const c=new T.PerspectiveCamera(30,innerWidth/innerHeight,.1,100);c.position.set(2,2.9,8);c.lookAt(0,1.05,0);s.add(new T.HemisphereLight('#fff8ee','#adc3c4',2.1));const sun=new T.DirectionalLight('#fff1df',2.35);sun.position.set(-3,6,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);s.add(sun);const floor=new T.Mesh(new T.PlaneGeometry(50,50),new T.MeshStandardMaterial({color:'#c3dba9',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;s.add(floor);
const l=new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath('/draco/')),mixers=[];for(const [id,x,height] of [['player',0,2.1],[25,-1.8,1.45],[132,1.8,.9]]){const g=await l.loadAsync('/models/'+id+'.glb');const o=g.scene;if(id===25)o.rotation.x=-Math.PI/2;o.updateMatrixWorld(true);let b=new T.Box3().setFromObject(o),scale=height/b.getSize(new T.Vector3()).y;o.scale.multiplyScalar(scale);o.updateMatrixWorld(true);b.setFromObject(o);o.position.set(x-b.getCenter(new T.Vector3()).x,-b.min.y,-b.getCenter(new T.Vector3()).z);o.traverse(m=>{if(!m.isMesh)return;m.castShadow=true;m.receiveShadow=true;if(id===132)m.material=new T.MeshStandardMaterial({map:m.material.map,color:'#e6b4f3',roughness:1,emissive:'#d9a6ed',emissiveMap:m.material.map,emissiveIntensity:.24,side:T.DoubleSide});});s.add(o);let m=new T.AnimationMixer(o);m.clipAction(g.animations.find(a=>a.name===(id==='player'?'Player_Idle':'Town_Idle'))).play();mixers.push(m);}
const clock=new T.Clock();function frame(){requestAnimationFrame(frame);let dt=clock.getDelta();mixers.forEach(m=>m.update(dt));r.render(s,c);}frame();
</script>
